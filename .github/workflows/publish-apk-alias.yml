name: Publish Stable APK Alias

# Every release names its APK with the version baked in
# (XDKNet_AndroidTV_v2.3.5.apk), so the /releases/latest/download/ URL for it
# breaks the moment the next version ships. That is fatal for a Downloader
# code: the code is minted once and then printed, shared and forgotten, so the
# URL behind it has to outlive every release.
#
# This attaches a second copy of the SAME artifact under a fixed name, giving
# one permanent address:
#
#   https://github.com/Devils-XDK/xdk-flix-plugin-dist/releases/latest/download/XDKNet_AndroidTV.apk
#
# It rebuilds nothing - it copies the asset the release already carries.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to alias (defaults to the latest release)
        required: false

permissions:
  contents: write

env:
  ALIAS_NAME: XDKNet_AndroidTV.apk

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Attach the fixed-name copy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          fi
          echo "Aliasing release $tag"

          assets=$(gh release view "$tag" --repo "$REPO" --json assets -q '.assets[].name')
          echo "Assets on $tag:"; echo "$assets" | sed 's/^/  /'

          # Already aliased (a re-run, or a release published with the fixed
          # name directly) - nothing to do.
          if grep -qx "$ALIAS_NAME" <<<"$assets"; then
            echo "$ALIAS_NAME is already attached to $tag; nothing to do."
            exit 0
          fi

          # Prefer the versioned name the build pipeline produces, but fall
          # back to any other APK so a one-off naming change does not silently
          # leave the permanent URL dead.
          src_name=$(grep -m1 -E '^XDKNet_AndroidTV_v.*\.apk$' <<<"$assets" || true)
          if [ -z "$src_name" ]; then
            src_name=$(grep -m1 -E '\.apk$' <<<"$assets" || true)
          fi
          if [ -z "$src_name" ]; then
            echo "::error::$tag has no .apk asset to alias"
            exit 1
          fi
          echo "Source asset: $src_name"

          mkdir -p dl
          gh release download "$tag" --repo "$REPO" --pattern "$src_name" --dir dl

          src="dl/$src_name"
          if [ ! -s "$src" ]; then
            echo "::error::failed to download $src_name from $tag"
            exit 1
          fi
          echo "Downloaded $(stat -c%s "$src") bytes"

          # Same bytes, fixed name. Copy rather than rename so the versioned
          # asset people already link to stays exactly where it is.
          cp "$src" "$ALIAS_NAME"
          if ! cmp -s "$src" "$ALIAS_NAME"; then
            echo "::error::copy did not match the source asset"
            exit 1
          fi

          gh release upload "$tag" "$ALIAS_NAME" --repo "$REPO" --clobber

      - name: Confirm the permanent URL resolves
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/$REPO/releases/latest/download/$ALIAS_NAME"

          # The alias only lands on /latest/ for a full release; a prerelease
          # keeps its asset but /latest/ still points at the last stable one.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 "$url" || true)
          echo "$url -> HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "::warning::$url is not resolving yet (HTTP $code). Expected for a prerelease; otherwise re-check."
          fi
